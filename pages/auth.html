<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../img/logo.png" />
    <title>Авторизация</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../css/main.css" />
  </head>
  <style>
    body {
      max-height: 100vh;
      padding: 1%;
    }
  </style>
  <body class="bg-black">
    <header
      class="content container p-3 border border-secondary rounded-4 bg-dark mb-4"
    >
      <div class="container text-center">
        <div class="row align-items-center">
          <!-- Контейнер с логотипом -->
          <div class="col d-flex justify-content-center">
            <div class="borderLogo">
              <img src="../img/logo.png" class="w-100 h-100" alt="Логотип" />
            </div>
          </div>
          <!-- Контейнер с кнопками для навигации -->
          <div class="col-md-6 d-flex justify-content-center gap-2">
            <!-- Кнопка меню -->
            <button
              class="btn btn-lg color-btn glow-btn bi-door-open fw-bold"
              type="submit"
              aria-expanded="false"
              id="BackButton"
            >
              Вернуться
            </button>
          </div>
          <!-- Контейнер с кнопкой авторизации -->
          <div class="col d-flex justify-content-center"></div>
        </div>
      </div>
    </header>
    <!-- Авторизация -->
    <div
      class="container-fluid flex-grow-1 d-flex align-items-center justify-content-center"
    >
      <div
        class="card text-center bg-dark p-3"
        style="width: 100%; max-width: 500px"
      >
        <div class="card-header text-start">
          <h5 class="text-secondary fs-4">Авторизация</h5>
        </div>
        <div class="card-body fs-5">
          <div class="container-fluid">
            <div class="d-block w-100 text-center gap-5 mx-auto mb-4">
              <i id="iAuth" class="bi bi-emoji-sunglasses iconColor"></i>
              <h2 class="textColor" id="h2reg">Добро пожаловать!</h2>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Введите вашу почту:</label>
              <input
                type="email"
                class="form-control w-75 mx-auto p-2 fs-5 bg-dark AuthInput text-light"
                id="email"
                name="email"
                placeholder="Введите ваш Email адрес"
                required
              />
            </div>
            <div class="mb-3">
              <label for="password" class="form-label"
                >Введите ваш пароль:</label
              >
              <input
                type="password"
                class="form-control w-75 mx-auto p-2 fs-5 bg-dark AuthInput text-light"
                id="password"
                name="password"
                placeholder="Введите ваш пароль"
                required
              />
            </div>
          </div>
        </div>
        <div
          class="card-footer border-0 bg-transparent d-flex justify-content-center gap-2"
        >
          <button
            type="button"
            class="btn btn-lg bg-primary color-btn glow-btn fw-bold"
            id="LoginButton"
          >
            Войти
          </button>
          <button
            type="button"
            class="btn btn-lg bg-danger color-btn glow-btn fw-bold"
            id="RegButton"
          >
            Зарегистрироваться
          </button>
        </div>
      </div>
    </div>

    <script src="https://thecode.media/wp-content/uploads/2019/12/snowfall2020.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="../js/script.js"></script>
  </body>
</html>
